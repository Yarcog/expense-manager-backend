spring.application.name=expense-manager
server.port=8080

# Secretos locales (no se versionan, ver secrets.properties.example)
spring.config.import=optional:file:./secrets.properties

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=expense_manager

logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
#creación automatica de indices
spring.data.mongodb.auto-index-creation=true 

# JWT (JSON Web Token)

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Código secreto para registrar usuarios ADMIN
admin.secret-code=${ADMIN_SECRET_CODE}